<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книги — Enjoy English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hover-scale { transition: all 0.3s ease; }
        .hover-scale:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.12); }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        .skiptranslate { display: none !important; }
        #google_translate_element { display: none !important; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 min-h-screen transition-colors duration-300">

    <div class="fixed bottom-4 right-4 z-50 flex gap-1 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-1 border border-gray-200 dark:border-gray-700">
        <button onclick="changeLang('ru')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">🇷🇺 RU</button>
        <button onclick="changeLang('en')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">🇬🇧 EN</button>
    </div>

    <div id="google_translate_element" style="display:none !important;"></div>

    <header class="bg-gray-800 shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white">
                    <i class="fas fa-arrow-left"></i> Назад
                </a>
                <div class="flex items-center gap-2">
                    <i class="fas fa-book text-2xl text-amber-400"></i>
                    <h1 class="text-xl font-bold text-white">Книги</h1>
                </div>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-moon dark:hidden text-gray-300"></i>
                    <i class="fas fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
                <a href="{% url 'logout' %}" class="text-red-400 text-sm">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 fade-in">

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for stat in book_stats %}
            <a href="{% url 'book_detail' stat.book.id %}"
               class="bg-gray-50 dark:bg-gray-800 rounded-xl shadow-md border border-gray-300 dark:border-gray-600 overflow-hidden hover-scale transition-colors cursor-pointer block">

                <div class="aspect-[3/4] bg-gradient-to-br from-amber-100 to-amber-300 dark:from-amber-900 dark:to-amber-700 flex items-center justify-center overflow-hidden">
                    {% if stat.book.photo %}
                    <img src="{{ stat.book.photo.url }}" alt="{{ stat.book.title }}" class="w-full h-full object-cover">
                    {% else %}
                    <i class="fas fa-book-open text-6xl text-white/70"></i>
                    {% endif %}
                </div>

                <div class="p-4">
                    <p class="font-bold text-gray-800 dark:text-white text-sm truncate" title="{{ stat.book.title }}">
                        {{ stat.book.title }}
                    </p>

                    <div class="mt-3 space-y-1 text-xs">
                        <div class="flex justify-between">
                            <span class="text-gray-500 dark:text-gray-400">На складе</span>
                            <span class="font-medium text-gray-700 dark:text-gray-300">{{ stat.book.quantity }} шт.</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500 dark:text-gray-400">Выдано</span>
                            <span class="font-bold text-green-600">{{ stat.students_with_book }}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500 dark:text-gray-400">Требуется</span>
                            <span class="font-bold {% if stat.students_need_book > 0 %}text-red-600{% else %}text-gray-400{% endif %}">
                                {{ stat.students_need_book }}
                            </span>
                        </div>
                    </div>
                </div>
            </a>
            {% empty %}
            <div class="col-span-full bg-gray-50 dark:bg-gray-800 rounded-xl p-12 text-center text-gray-400 shadow-md border border-gray-300 dark:border-gray-600">
                <i class="fas fa-inbox text-5xl mb-3"></i>
                <p>Книг пока нет</p>
            </div>
            {% endfor %}
        </div>

    </main>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
        function changeLang(lang) {
            document.cookie = `googtrans=/ru/${lang}; path=/`;
            document.cookie = `googtrans=/ru/${lang}; domain=.${location.hostname}; path=/`;
            location.reload();
        }
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'ru,kk,en',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
