<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} — Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        .reader { flex: 1; min-height: 0; position: relative; }
        .reader iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--surface-3); }
        .reader-empty { height: 100%; display: grid; place-items: center; padding: 24px; }
        .reader-empty .panel { width: 100%; max-width: 440px; }
    </style>
    {% include 'dashboard/partials/theme.html' %}
</head>
<body class="h-screen flex flex-col">

    <!-- Верхняя панель -->
    <header class="flex-shrink-0">
        <div class="ee-head px-4 sm:px-6">
            <div class="ee-head-main">
                <a href="javascript:history.back()" class="head-back" aria-label="Закрыть" title="Закрыть"><i class="fas fa-xmark"></i></a>
                <span class="head-icon"><i class="fas fa-book-open"></i></span>
                <div class="min-w-0">
                    <h1 class="head-title notranslate">{{ book.title }}</h1>
                </div>
            </div>

            <div class="ee-head-actions">
                {% if book.pdf_file %}
                <a href="{{ book.pdf_file.url }}" download class="head-btn" title="Скачать PDF" aria-label="Скачать PDF">
                    <i class="fas fa-download"></i><span class="hidden sm:inline">Скачать PDF</span>
                </a>
                <a href="{{ book.pdf_file.url }}" target="_blank" class="head-btn" title="Открыть в новой вкладке" aria-label="Открыть в новой вкладке">
                    <i class="fas fa-arrow-up-right-from-square"></i>
                </a>
                {% endif %}
                <button type="button" onclick="toggleFullscreen()" class="head-btn" title="На весь экран" aria-label="На весь экран">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- PDF -->
    <main class="reader">
        {% if book.pdf_file %}
        <iframe src="{{ book.pdf_file.url }}#toolbar=1&navpanes=0&view=FitH" title="{{ book.title }}" class="notranslate"></iframe>
        {% else %}
        <div class="reader-empty">
            <div class="panel ee-empty">
                <i class="fas fa-file-pdf"></i>
                <b>PDF ещё не загружен</b>
                <p>Разработчик должен загрузить PDF через админку</p>
            </div>
        </div>
        {% endif %}
    </main>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !document.fullscreenElement) {
                history.back();
            }
        });
    </script>
</body>
</html>
