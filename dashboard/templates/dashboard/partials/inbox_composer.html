{% comment %}Форма «Написать про ученика»: choices — [(группа, ученики)], preselect — id ученика{% endcomment %}
{% if choices %}
<form method="POST" action="{% url 'send_message' %}" class="space-y-4" id="composer">
    {% csrf_token %}
    <input type="hidden" name="group_id" id="groupId">
    <label class="block text-sm font-bold">Ученик
        <select name="student_id" id="studentSelect" class="mt-1" required>
            <option value="">— выберите ученика —</option>
            {% for g, students in choices %}
            <optgroup label="{{ g.name }}" data-group="{{ g.id }}" class="notranslate">
                {% for s in students %}<option class="notranslate" value="{{ s.id }}" data-group="{{ g.id }}" {% if preselect == s.id|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </label>
    <fieldset class="cats">
        <legend class="sr-only">Категория</legend>
        <label><input type="radio" name="category" value="comment" checked><span><i class="fas fa-comment"></i>Комментарий</span></label>
        <label><input type="radio" name="category" value="complaint"><span><i class="fas fa-triangle-exclamation"></i>Жалоба</span></label>
    </fieldset>
    <label class="block text-sm font-bold">Сообщение
        <textarea name="text" rows="4" maxlength="2000" required class="mt-1" placeholder="Например: стал пропускать домашку, хорошо отвечает на уроке, мешает другим…"></textarea>
    </label>
    <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i>Отправить</button>
</form>
{% else %}
<p class="text-sm text-gray-500">У вас пока нет учеников в группах.</p>
{% endif %}
