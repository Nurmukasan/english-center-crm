{% comment %}Телефон с кнопками «позвонить» и «WhatsApp». Параметр: phone{% endcomment %}{% load custom_filters %}{% with digits=phone|phone_digits %}{% if digits %}<span class="ee-phone"><a href="tel:+{{ digits }}" class="ee-phone-link notranslate" title="Позвонить">{{ phone }}</a><a href="https://wa.me/{{ digits }}" target="_blank" rel="noopener" class="ee-phone-wa" title="Написать в WhatsApp" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a></span>{% else %}<span class="notranslate">{{ phone|default:"—" }}</span>{% endif %}{% endwith %}
