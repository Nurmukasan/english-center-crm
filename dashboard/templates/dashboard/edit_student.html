<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать ученика — Enjoy English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Google Translate скрываем */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        .skiptranslate { display: none !important; }
        #google_translate_element { display: none !important; }
        .goog-logo-link { display: none !important; }
        .goog-te-gadget { display: none !important; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    
    <!-- Переключатель языков -->
    <div class="fixed bottom-4 right-4 z-50 flex gap-1 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-1 border border-gray-200 dark:border-gray-700">
        <button onclick="changeLang('ru')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">🇷🇺 RU</button>
        
        <button onclick="changeLang('en')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">🇬🇧 EN</button>
    </div>
    
    <div id="google_translate_element" style="display:none !important;"></div>
    
    <header class="bg-gray-800 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'students_list' %}" class="text-gray-300 hover:text-white">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
            <h1 class="text-xl font-bold text-white">Редактировать ученика</h1>
            <div></div>
        </div>
    </header>
    
    <main class="max-w-3xl mx-auto px-4 py-8 fade-in">
        
        <div class="bg-gray-50 dark:bg-gray-800 rounded-xl shadow-md p-8 border border-gray-300 dark:border-gray-600 transition-colors">
            
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="return_url" value="{{ request.GET.return|default:'' }}">
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">
                        <i class="fas fa-user text-indigo-500 mr-1"></i>Имя *
                    </label>
                    <input type="text" name="name" value="{{ student.name }}" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Телефон</label>
                    <input type="text" name="phone" value="{{ student.phone }}"
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Школа</label>
                        <input type="text" name="school" value="{{ student.school }}"
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Класс</label>
                        <input type="text" name="grade" value="{{ student.grade }}"
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Возраст</label>
                        <input type="number" name="age" value="{{ student.age|default:'' }}"
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Родитель</label>
                        <input type="text" name="parent_name" value="{{ student.parent_name }}"
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Телефон родителя</label>
                        <input type="text" name="parent_phone" value="{{ student.parent_phone }}"
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-3">
                        <i class="fas fa-users text-indigo-500 mr-1"></i>Группы
                    </label>
                    <div class="space-y-2">
                        {% for group in groups %}
                        <label class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="groups" value="{{ group.id }}"
                                   {% if group.id in student_groups %}checked{% endif %}
                                   class="w-5 h-5 text-indigo-600">
                            <div>
                                <p class="font-medium text-gray-800 dark:text-white">{{ group.name }}</p>
                                <p class="text-sm text-gray-400">{{ group.get_schedule_display }}</p>
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                
                <button type="submit"
                        class="w-full bg-indigo-500 text-white py-3 rounded-lg font-medium hover:bg-indigo-600 transition">
                    <i class="fas fa-save mr-2"></i>Сохранить
                </button>
                
            </form>
            
        </div>
        
    </main>
    
    <script>
        function changeLang(lang) {
            document.cookie = `googtrans=/ru/${lang}; path=/`;
            document.cookie = `googtrans=/ru/${lang}; domain=.${location.hostname}; path=/`;
            location.reload();
        }
        
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'ru,kk,en',
                autoDisplay: false
            }, 'google_translate_element');
        }
        // Навигация стрелками по полям
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            if (!form) return;
    
            const fields = Array.from(form.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"]), select, textarea'));
    
            fields.forEach((field, index) => {
                field.addEventListener('keydown', function(e) {
                    let nextIndex = null;
            
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        nextIndex = index + 1;
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        nextIndex = index - 1;
                    }
            
                    if (nextIndex !== null && fields[nextIndex]) {
                        e.preventDefault();
                        fields[nextIndex].focus();
                        // Если это text/number — выделяем текст
                        if (fields[nextIndex].select && fields[nextIndex].type !== 'checkbox') {
                            fields[nextIndex].select();
                        }
                    }
                });
            });
        });
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
</body>
</html>
