<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход — Enjoy English CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .lo-card { padding: 34px 30px 28px; text-align: center; }
        .lo-icon { width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; font-size: 26px;
            color: var(--accent-ink); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
    </style>
    {% include 'dashboard/partials/theme.html' %}
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    {# Сюда попадают, только если открыли /logout/ ссылкой: выходим кнопкой, чтобы чужой сайт не мог выкинуть из CRM #}
    <main class="w-full max-w-sm">
        <div class="panel lo-card">
            <div class="lo-icon"><i class="fas fa-arrow-right-from-bracket"></i></div>
            <h1 class="text-xl font-extrabold text-gray-800">Выйти из CRM?</h1>
            <form method="POST" action="{% url 'logout' %}" class="mt-6 flex gap-2">
                {% csrf_token %}
                <a href="{% url 'dashboard' %}" class="ee-btn ee-btn-soft flex-1">Отмена</a>
                <button type="submit" class="ee-btn ee-btn-primary flex-1"><i class="fas fa-arrow-right-from-bracket"></i>Выйти</button>
            </form>
        </div>
    </main>
</body>
</html>
