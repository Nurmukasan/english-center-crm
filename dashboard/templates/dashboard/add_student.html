<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить ученика — English Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <header class="bg-white shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'students_list' %}" class="text-gray-600 hover:text-gray-800">← Назад</a>
            <h1 class="text-xl font-bold text-gray-800">Добавить ученика</h1>
            <a href="{% url 'profile' %}" class="flex items-center gap-2 hover:opacity-80 transition">
                {% if request.user.profile.photo %}
                <img src="{{ request.user.profile.photo.url }}" alt="Фото"
                    class="w-8 h-8 rounded-full object-cover border border-gray-200">
                {% else %}
                <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-sm">👤</div>
                {% endif %}
            </a>
        </div>
    </header>
    
    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <div class="bg-white rounded-xl shadow-sm p-8 border border-gray-100">
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Имя ученика *</label>
                    <input type="text" name="name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Например: Алия Маратова">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Телефон ученика</label>
                    <input type="text" name="phone"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="+7 777 123 4567">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Родитель</label>
                        <input type="text" name="parent_name"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                               placeholder="Имя родителя">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Телефон родителя</label>
                        <input type="text" name="parent_phone"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                               placeholder="+7 777 987 6543">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">Школа</label>
                            <input type="text" name="school"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="Например: НИШ">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">Класс</label>
                            <input type="text" name="grade"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="Например: 9Б">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">Возраст</label>
                            <input type="number" name="age"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="Например: 14">
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-3">Группы</label>
                    <div class="space-y-2">
                        {% for group in groups %}
                        <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="checkbox" name="groups" value="{{ group.id }}" class="w-5 h-5 text-indigo-600">
                            <div>
                                <p class="font-medium text-gray-800">{{ group.name }}</p>
                                <p class="text-sm text-gray-400">{{ group.schedule }}</p>
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">
                    Добавить ученика
                </button>
                
            </form>
            
        </div>
        
    </main>
    
</body>
</html>
