<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать группу — Enjoy English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    
    <header class="bg-gray-800 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
            <h1 class="text-xl font-bold text-white">Создать группу</h1>
            <div></div>
        </div>
    </header>
    
    <main class="max-w-3xl mx-auto px-4 py-8 fade-in">
        
        {% if messages %}
            {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg 
                {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-400
                {% else %}bg-red-100 text-red-700 border border-red-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        
        <div class="bg-gray-50 dark:bg-gray-800 rounded-xl shadow-md p-8 border border-gray-300 dark:border-gray-600 transition-colors">
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">
                        <i class="fas fa-book text-indigo-500 mr-1"></i>Название группы *
                    </label>
                    <input type="text" name="name" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Например: Pre-Intermediate A2">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Тип</label>
                    <select name="group_type" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                        <option value="group">Групповая</option>
                        <option value="individual">Индивидуальная</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">
                        <i class="fas fa-user-tie text-indigo-500 mr-1"></i>Учитель *
                    </label>
                    <select name="teacher" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.username }}</option>
                        {% empty %}
                        <option value="">Нет учителей</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-3">
                        <i class="fas fa-calendar text-indigo-500 mr-1"></i>Расписание
                    </label>
                
                    <!-- Дни недели -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Пн" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Пн</span>
                        </label>
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Вт" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Вт</span>
                        </label>
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Ср" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Ср</span>
                        </label>
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Чт" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Чт</span>
                        </label>
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Пт" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Пт</span>
                        </label>
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Сб" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Сб</span>
                        </label>
                        <label
                            class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="days" value="Вс" class="day-checkbox w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Вс</span>
                        </label>
                    </div>
                
                    <!-- Время -->
                    <div class="flex gap-3 items-center">
                        <input type="text" name="time" placeholder="18:00-19:30"
                            class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">
                        <i class="fas fa-money-bill text-indigo-500 mr-1"></i>Цена (₸)
                    </label>
                    <input type="number" name="price" value="0"
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <button type="submit"
                        class="w-full bg-indigo-500 text-white py-3 rounded-lg font-medium hover:bg-indigo-600 transition">
                    <i class="fas fa-plus mr-2"></i>Создать группу
                </button>
                
            </form>
            
        </div>
        
    </main>
    
</body>
</html>
