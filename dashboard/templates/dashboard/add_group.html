<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать группу — English Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-['Inter']">
    
    <header class="bg-white shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-200 transition">
                    🌙
                </button>
            <a href="{% url 'dashboard' %}" class="text-gray-600 hover:text-gray-800">← Назад</a>
            <h1 class="text-xl font-bold text-gray-800">Создать группу</h1>
            <div></div>
        </div>
    </header>
    
    <main class="max-w-3xl mx-auto px-4 py-8">
        
        {% if messages %}
            {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg 
                {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-400
                {% else %}bg-red-100 text-red-700 border border-red-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        
        <div class="bg-white rounded-xl shadow-sm p-8 border border-gray-100">
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Название группы *</label>
                    <input type="text" name="name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Например: Pre-Intermediate A2">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Тип *</label>
                    <select name="group_type" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                        <option value="group">Групповая</option>
                        <option value="individual">Индивидуальная</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Учитель *</label>
                    <select name="teacher" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.username }}</option>
                        {% empty %}
                        <option value="">Нет учителей</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Расписание</label>
                    <input type="text" name="schedule"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg"
                           placeholder="Пн, Ср, Пт 18:00-19:30">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">Цена (₸)</label>
                    <input type="number" name="price" value="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">
                    Создать группу
                </button>
                
            </form>
            
        </div>
        
    </main>
    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
