{% load custom_filters %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать группу — Enjoy English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Google Translate скрываем */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        .skiptranslate { display: none !important; }
        #google_translate_element { display: none !important; }
        .goog-logo-link { display: none !important; }
        .goog-te-gadget { display: none !important; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    
    <!-- Переключатель языков -->
    <div class="fixed bottom-4 right-4 z-50 flex gap-1 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-1 border border-gray-200 dark:border-gray-700">
        <button onclick="changeLang('ru')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">🇷🇺 RU</button>
        
        <button onclick="changeLang('en')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">🇬🇧 EN</button>
    </div>
    
    <div id="google_translate_element" style="display:none !important;"></div>
    
    <header class="bg-gray-800 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
            <h1 class="text-xl font-bold text-white">Редактировать группу</h1>
            <div></div>
        </div>
    </header>
    
    <main class="max-w-3xl mx-auto px-4 py-8 fade-in">
        
        <div class="bg-gray-50 dark:bg-gray-800 rounded-xl shadow-md p-8 border border-gray-300 dark:border-gray-600 transition-colors">
            
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="is_active" value="on">
                <input type="hidden" name="return_url" value="{{ request.GET.return|default:'' }}">
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Название</label>
                    <input type="text" name="name" value="{{ group.name }}" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Тип</label>
                    <select name="group_type" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                        <option value="group" {% if group.group_type == 'group' %}selected{% endif %}>Групповая</option>
                        <option value="individual" {% if group.group_type == 'individual' %}selected{% endif %}>Индивидуальная</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Учитель</label>
                    <select name="teacher" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}" {% if group.teacher_id == teacher.id %}selected{% endif %}>{{ teacher.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Дополнительные учителя</label>
                    <div class="space-y-2">
                        {% for teacher in teachers %}
                        {% if teacher.id != group.teacher_id %}
                        <label class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="additional_teachers" value="{{ teacher.id }}" {% if teacher in group.teachers.all %}checked{% endif %} class="w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">{{ teacher.username }}</span>
                        </label>
                        {% endif %}
                        {% endfor %}
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-3">
                        <i class="fas fa-calendar text-indigo-500 mr-1"></i>Расписание
                    </label>
                    <div class="space-y-2">
                        <!-- Пн -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_0" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'0' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Пн</span>
                            </label>
                            <input type="text" name="start_0" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'0' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_0" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'0' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Вт -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_1" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'1' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Вт</span>
                            </label>
                            <input type="text" name="start_1" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'1' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_1" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'1' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Ср -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_2" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'2' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Ср</span>
                            </label>
                            <input type="text" name="start_2" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'2' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_2" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'2' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Чт -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_3" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'3' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Чт</span>
                            </label>
                            <input type="text" name="start_3" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'3' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_3" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'3' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Пт -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_4" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'4' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Пт</span>
                            </label>
                            <input type="text" name="start_4" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'4' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_4" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'4' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Сб -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_5" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'5' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Сб</span>
                            </label>
                            <input type="text" name="start_5" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'5' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_5" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'5' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Вс -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_6" value="1" class="w-4 h-4 text-indigo-600" {% if schedule_slots|get_item:'6' %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Вс</span>
                            </label>
                            <input type="text" name="start_6" placeholder="20:00" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'6' %}{{ slot.start_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="text" name="end_6" placeholder="21:30" pattern="[0-9]{1,2}:[0-9]{2}" maxlength="5" value="{% with slot=schedule_slots|get_item:'6' %}{{ slot.end_time|time:'H:i' }}{% endwith %}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Цена (₸)</label>
                    <input type="number" name="price" value="{{ group.price }}"
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                </div>
                
                <button type="submit"
                        class="w-full bg-indigo-500 text-white py-3 rounded-lg font-medium hover:bg-indigo-600 transition">
                    <i class="fas fa-save mr-2"></i>Сохранить
                </button>
                
            </form>
            
        </div>
        
    </main>
    
    <script>
        document.querySelectorAll('input[pattern*="[0-9]"]').forEach(input => {
            input.addEventListener('input', function() {
                let val = this.value.replace(/\D/g, '');
                if (val.length >= 3) {
                    this.value = val.slice(0, val.length - 2) + ':' + val.slice(-2);
                } else {
                    this.value = val;
                }
            });
        });
        
        function changeLang(lang) {
            document.cookie = `googtrans=/ru/${lang}; path=/`;
            document.cookie = `googtrans=/ru/${lang}; domain=.${location.hostname}; path=/`;
            location.reload();
        }
        
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'ru,kk,en',
                autoDisplay: false
            }, 'google_translate_element');
        }
        // Навигация стрелками по полям
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            if (!form) return;
    
            const fields = Array.from(form.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"]), select, textarea'));
    
            fields.forEach((field, index) => {
                field.addEventListener('keydown', function(e) {
                    let nextIndex = null;
            
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        nextIndex = index + 1;
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        nextIndex = index - 1;
                    }
            
                    if (nextIndex !== null && fields[nextIndex]) {
                        e.preventDefault();
                        fields[nextIndex].focus();
                        // Если это text/number — выделяем текст
                        if (fields[nextIndex].select && fields[nextIndex].type !== 'checkbox') {
                            fields[nextIndex].select();
                        }
                    }
                });
            });
        });
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
</body>
</html>
