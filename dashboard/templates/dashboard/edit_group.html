<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать группу — Enjoy English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    
    <header class="bg-gray-800 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
            <h1 class="text-xl font-bold text-white">Редактировать группу</h1>
            <div></div>
        </div>
    </header>
    
    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <div class="bg-gray-50 dark:bg-gray-800 rounded-xl shadow-md p-8 border border-gray-300 dark:border-gray-600">
            
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="is_active" value="on">
                <input type="hidden" name="return_url" value="{{ request.GET.return|default:'' }}">
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Название</label>
                    <input type="text" name="name" value="{{ group.name }}" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Тип</label>
                    <select name="group_type" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                        <option value="group" {% if group.group_type == 'group' %}selected{% endif %}>Групповая</option>
                        <option value="individual" {% if group.group_type == 'individual' %}selected{% endif %}>Индивидуальная</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Учитель</label>
                    <select name="teacher" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}" {% if group.teacher_id == teacher.id %}selected{% endif %}>{{ teacher.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Дополнительные учителя</label>
                    <div class="space-y-2">
                        {% for teacher in teachers %}
                        {% if teacher.id != group.teacher_id %}
                        <label class="flex items-center gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <input type="checkbox" name="additional_teachers" value="{{ teacher.id }}" {% if teacher in group.teachers.all %}checked{% endif %} class="w-4 h-4 text-indigo-600">
                            <span class="text-sm text-gray-700 dark:text-gray-300">{{ teacher.username }}</span>
                        </label>
                        {% endif %}
                        {% endfor %}
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-3">
                        <i class="fas fa-calendar text-indigo-500 mr-1"></i>Расписание
                    </label>
                    <div class="space-y-2">
                        <!-- Пн -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_0" value="1" class="w-4 h-4 text-indigo-600" {% if 0 in schedule_slots %}checked{% endif %}>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Пн</span>
                            </label>
                            <input type="time" name="start_0" value="{{ schedule_slots|get_item:0|default:'' }}" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_0" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Вт -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_1" value="1" class="w-4 h-4 text-indigo-600">
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Вт</span>
                            </label>
                            <input type="time" name="start_1" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_1" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Ср -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_2" value="1" class="w-4 h-4 text-indigo-600">
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Ср</span>
                            </label>
                            <input type="time" name="start_2" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_2" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Чт -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_3" value="1" class="w-4 h-4 text-indigo-600">
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Чт</span>
                            </label>
                            <input type="time" name="start_3" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_3" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Пт -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_4" value="1" class="w-4 h-4 text-indigo-600">
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Пт</span>
                            </label>
                            <input type="time" name="start_4" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_4" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Сб -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_5" value="1" class="w-4 h-4 text-indigo-600">
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Сб</span>
                            </label>
                            <input type="time" name="start_5" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_5" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                        
                        <!-- Вс -->
                        <div class="flex items-center gap-3 p-3 border border-gray-300 dark:border-gray-600 rounded-lg">
                            <label class="flex items-center gap-2 w-20">
                                <input type="checkbox" name="day_6" value="1" class="w-4 h-4 text-indigo-600">
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Вс</span>
                            </label>
                            <input type="time" name="start_6" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                            <span class="text-gray-400">—</span>
                            <input type="time" name="end_6" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm">
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2">Цена (₸)</label>
                    <input type="number" name="price" value="{{ group.price }}"
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg">
                </div>
                
                <button type="submit"
                        class="w-full bg-indigo-500 text-white py-3 rounded-lg font-medium hover:bg-indigo-600 transition">
                    <i class="fas fa-save mr-2"></i>Сохранить
                </button>
                
            </form>
            
        </div>
        
    </main>
    
</body>
</html>
