<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что-то сломалось — Enjoy English CRM</title>
    <style>
        :root { --bg: #f5f4f1; --surface: #fff; --line: #e8e5e1; --ink: #1f1c1a; --muted: #78716c; --accent: #f97316; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg);
            font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
        .card { max-width: 440px; width: 100%; padding: 36px 28px; text-align: center; background: var(--surface);
            border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px -18px rgba(31, 28, 26, .18); }
        .code { font-size: 56px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); line-height: 1; }
        h1 { font-size: 20px; margin: 14px 0 8px; }
        p { margin: 0; color: var(--muted); line-height: 1.5; }
        a { display: inline-block; margin-top: 22px; padding: 11px 20px; border-radius: 12px; font-weight: 700; color: #fff;
            background: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>Что-то сломалось</h1>
        <p>На сервере произошла ошибка. Попробуйте ещё раз через минуту; если повторится — напишите разработчику, что вы делали.</p>
        <a href="/dashboard/">На главную</a>
    </div>
</body>
</html>
